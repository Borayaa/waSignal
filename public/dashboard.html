<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>waSignal Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span> waSignal <em>Trading</em></div>
  <span id="acct" class="acct"></span>
  <span class="sp"></span>
  <span id="pill" class="pill off">…</span>
  <button id="logout" class="btn sm">Logout</button>
</header>
<div class="shell">
  <nav class="nav" id="nav">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="signals">Signals</button>
    <button data-tab="trades">Trades</button>
    <button data-tab="whatsapp">WhatsApp</button>
    <button data-tab="automation">Automation</button>
    <button data-tab="costs">Costs</button>
    <button data-tab="playground">Playground</button>
  </nav>
  <main>
    <section class="tab active" id="tab-overview">
      <div id="brokerBanner" class="banner" hidden>Connect your cTrader (IC Markets) account in Automation. <button class="btn sm primary" data-goto="automation">Open Automation</button></div>
      <div class="grid kpis" id="kpisAcct"></div>
      <div class="head"><h2>Today</h2></div>
      <div class="grid kpis" id="kpisStats"></div>
      <div class="head"><h2>Open positions</h2><span class="sp"></span><svg id="spark" class="spark" hidden style="max-width:240px"></svg></div>
      <div class="tbl-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th class="num">Lots</th><th class="num">Entry</th><th class="num">SL</th><th class="num">TP</th><th class="num">Swap</th><th class="num">Comm.</th><th class="num">Profit</th><th>Opened</th><th></th></tr></thead><tbody id="positions"></tbody></table></div>
    </section>
    <section class="tab" id="tab-signals"><div class="head"><h2>Signals feed</h2></div><div class="feed" id="signals"></div></section>
    <section class="tab" id="tab-trades"><div class="head"><h2>Trades log</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Result</th><th>Ticket</th><th>Details</th></tr></thead><tbody id="trades"></tbody></table></div></section>
    <section class="tab" id="tab-whatsapp"><div class="head"><h2>WhatsApp</h2></div><div class="grid two" id="wa"></div></section>
    <section class="tab" id="tab-automation"><div class="head"><h2>Automation</h2></div><div class="grid two" id="auto"></div></section>
    <section class="tab" id="tab-costs"><div class="head"><h2>Costs</h2><span class="sp"></span><label class="small muted" for="costMonth">Month</label><input type="month" id="costMonth" style="width:auto"></div><div id="costs"></div></section>
    <section class="tab" id="tab-playground"><div class="head"><h2>Playground</h2></div><div class="grid two" id="play"></div></section>
  </main>
</div>
<div id="toasts"></div>
<script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
